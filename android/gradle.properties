# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure.
android.useAndroidX=true

kotlin.code.style=official

# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

# How long a release's publish to Maven Central waits for Central to validate
# and publish the deployment, in seconds (3000 is 50 minutes). Past that the
# build fails, though Central still publishes a deployment that validates.
# See "Releases" in android/README.md for what to do then. The publish job of
# .github/workflows/android-sdk-release.yaml has to time out later than this.
SONATYPE_CLOSE_TIMEOUT_SECONDS=3000
