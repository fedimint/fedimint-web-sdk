name: Verify
on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
    inputs:
      run_core:
        description: 'Run the JS build, unit test, and typecheck jobs'
        required: false
        type: boolean
        default: true
      run_web:
        description: "Run the browser package's tests against a devimint federation"
        required: false
        type: boolean
        default: true
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Lint repo
        run: pnpm --dir js lint:repo

      - name: Lint code
        run: pnpm --dir js lint

  build:
    name: Build JS
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.run_core != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build
        run: pnpm --dir js build

  unit:
    name: Unit Tests
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.run_core != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run unit tests
        run: pnpm --dir js test:unit

  types:
    name: Check Types
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.run_core != false }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Check types
        run: pnpm --dir js typecheck

  test:
    name: Test
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.run_web != false }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install JS dependencies
        # The default shell has pnpm and node; `.#wasm-tests` is entered only by the step that
        # runs the devimint-backed tests, so its closure is not realised before it is needed.
        shell: bash
        run: nix develop --accept-flake-config --command pnpm --dir js install

      - name: Build SDK web bindings
        uses: ./.github/actions/build-sdk-web

      - name: Run pnpm tests
        shell: bash
        run: |
          nix develop --accept-flake-config .#wasm-tests --command bash << 'EOF'
            set -euo pipefail
            pnpm --dir js build
            pnpm --dir js test
          EOF
