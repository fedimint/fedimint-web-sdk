packages:
  - 'android/*'
  - 'web/*'
  - 'react-native/*'
  - 'examples/*'

# A flat node_modules, as npm lays it out: React Native's Gradle plugin and Metro resolve
# packages such as @react-native/codegen from the app directory without declaring them, which
# pnpm's default symlinked layout does not provide. pnpm 10 and later read this setting here,
# not from .npmrc.
nodeLinker: hoisted

allowBuilds:
  # Uses the platform optional dependency directly; its install script only
  # rebuilds when npm_config_build_from_source=true.
  '@parcel/watcher': false
  # Appium's CLI works fine without its postinstall (verified with
  # `appium --version`); uiautomator2 is installed explicitly via
  # `appium driver install` at test-run time instead, not via this build
  # script. edgedriver/geckodriver are Selenium's Edge/Firefox driver
  # downloaders, pulled in transitively — irrelevant to Android/UiAutomator2
  # testing. All three left disabled; flip `appium` to true if a future
  # version's postinstall turns out to matter.
  appium: false
  edgedriver: false
  esbuild: true
  geckodriver: false
  sharp: true
  simple-git-hooks: true
  # Loads the platform optional binding directly. The postinstall only repairs
  # missing bindings via npm/downloads, which normal pnpm installs do not need.
  unrs-resolver: false

overrides:
  'dom-serializer@2.0.0>entities': '4.4.0'
